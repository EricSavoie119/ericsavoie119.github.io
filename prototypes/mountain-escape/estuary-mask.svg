<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1440 120" preserveAspectRatio="none">
  <!-- A static feathered mixing front, not a hard wave or animated blur. -->
  <defs>
    <filter id="mix" x="-10%" y="-100%" width="120%" height="300%" color-interpolation-filters="sRGB">
      <feGaussianBlur stdDeviation="12 9"/>
    </filter>
    <linearGradient id="settle" x2="0" y2="1">
      <stop offset="0" stop-color="white" stop-opacity="0"/>
      <stop offset="1" stop-color="white"/>
    </linearGradient>
  </defs>
  <path fill="white" filter="url(#mix)" d="M-80 50 C170 33 265 65 470 51 S700 34 860 46 S1120 69 1520 40 L1520 200 L-80 200Z"/>
  <rect y="80" width="1440" height="40" fill="url(#settle)"/>
</svg>
